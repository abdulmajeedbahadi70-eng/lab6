<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Book Records</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }
      .container {
        max-width: 500px;
        margin: auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      select {
        width: 100%;
        padding: 8px;
        margin-top: 10px;
        margin-bottom: 20px;
      }
      .book-details {
        background-color: #f9f9f9;
        padding: 15px;
        border-radius: 5px;
        border: 1px solid #e1e1e1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Book Information Search</h2>

      <!-- iii. Select element to allow user to select a book title -->
      <label for="bookSelect">Select Book Title:</label>
      <select id="bookSelect">
        <option value="">-- Select a Book --</option>
      </select>

      <!-- iv. Display area for book details -->
      <div class="book-details" id="bookDetails" style="display: none">
        <h3>Book Details</h3>
        <p><strong>Title:</strong> <span id="title"></span></p>
        <p><strong>Author:</strong> <span id="author"></span></p>
        <p><strong>Publication Year:</strong> <span id="year"></span></p>
        <p><strong>Genres:</strong> <span id="genres"></span></p>
      </div>
    </div>

    <script>
      // Replace with your actual GitHub Raw URL for books.json
      const jsonUrl =
        "https://github.com/abdulmajeedbahadi70-eng/lab6/main/books.json";
      let booksData = [];

      // ii. Use JavaScript's fetch() function to retrieve the JSON data from GitHub
      fetch(jsonUrl)
        .then((response) => response.json())
        .then((data) => {
          booksData = data.Books;
          const selectElement = document.getElementById("bookSelect");

          // Populate the select dropdown with book titles dynamically
          booksData.forEach((book, index) => {
            const option = document.createElement("option");
            option.value = index; // Store index to reference the book record easily
            option.textContent = book.title;
            selectElement.appendChild(option);
          });
        })
        .catch((error) => console.error("Error fetching JSON data:", error));

      // iii. & iv. Find the matching book record and display details on change
      document
        .getElementById("bookSelect")
        .addEventListener("change", function () {
          const selectedIndex = this.value;
          const detailsDiv = document.getElementById("bookDetails");

          if (selectedIndex === "") {
            detailsDiv.style.display = "none";
            return;
          }

          const book = booksData[selectedIndex];

          // Update DOM elements with selected book data
          document.getElementById("title").textContent = book.title;
          document.getElementById("author").textContent = book.author;
          document.getElementById("year").textContent = book.publicationYear;
          document.getElementById("genres").textContent =
            book.genres.join(", ");

          detailsDiv.style.display = "block";
        });
    </script>
  </body>
</html>
